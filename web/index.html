<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Code Ascension Academy</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            margin: 0;
        }

        body {
            display: flex;
            align-items: center;
            justify-content: center;

            background:
                radial-gradient(
                    circle at top,
                    #14243d 0%,
                    #080d16 45%,
                    #04070c 100%
                );

            color: #eaf6ff;

            font-family:
                Inter,
                Segoe UI,
                Arial,
                sans-serif;
        }

        .academy {
            text-align: center;
        }

        .academy h1 {
            margin: 0;

            font-size: 64px;
            letter-spacing: -2px;
        }

        .academy h1 span {
            color: #38d7ff;

            text-shadow:
                0 0 22px rgba(56, 215, 255, 0.55);
        }

    </style>
</head>

<body>
    <main class="academy">
        <h1>
            CODE ASCENSION
            <span>ACADEMY</span>
        </h1>

    </main>
</body>
</html>
